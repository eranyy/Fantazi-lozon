name: Security Scan & AI Code Review

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  security-check:
    name: Security & AppSec Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 1. Audit Dependencies (npm audit)
        run: |
          echo "Running dependency vulnerability audit..."
          npm audit --audit-level=high || true

      - name: 2. Secrets Leak Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. Extract Git Diff
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff origin/${{ github.base_ref }}...HEAD -- . ':(exclude)package-lock.json' ':(exclude)*.lock' > pr_diff.txt || touch pr_diff.txt
          else
            git diff HEAD~1...HEAD -- . ':(exclude)package-lock.json' ':(exclude)*.lock' > pr_diff.txt || touch pr_diff.txt
          fi
          echo "diff_size=$(wc -c < pr_diff.txt)" >> $GITHUB_OUTPUT
          echo "Extracted git diff size: $(wc -c < pr_diff.txt) bytes."

      - name: 4. AI Security Review (Gemini Flash)
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const fs = require('fs');
            let diff = '';
            if (fs.existsSync('pr_diff.txt')) {
              diff = fs.readFileSync('pr_diff.txt', 'utf8');
            }

            if (!diff || !diff.trim()) {
              console.log("✅ No code changes to review in this commit/PR.");
              return;
            }

            if (!process.env.GEMINI_API_KEY) {
              console.log("ℹ️ GEMINI_API_KEY secret is not set in repository settings. Skipping AI review call.");
              return;
            }

            const prompt = `אתה סוכן AppSec בכיר. ערוך בדיקת אבטחה תמציתית על שינויי הקוד הבאים.
            
התמקד ב:
- חשיפת מפתחות/סודות (.env / API keys)
- בעיות OWASP (XSS, SQLi, אימות קלט, הרשאות)
- שמירת מידע רגיש לא מאובטח

עבור כל ממצא ציין:
1. רמת חומרה [Critical / High / Medium / Low]
2. קובץ ושורה
3. הסבר קצר על הסיכון
4. קוד מתוקן מוצע

אם אין בעיות אבטחה, רשום רק: "✅ לא זוהו בעיות אבטחה בשינויים אלה."

שינויי הקוד (Git Diff):
\`\`\`diff
${diff.slice(0, 30000)}
\`\`\``;

            try {
              const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${process.env.GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: prompt }] }]
                })
              });

              const data = await response.json();
              const reviewText = data.candidates?.[0]?.content?.parts?.[0]?.text || "לא התקבלה תשובה מהמודל.";

              if (context.issue && context.issue.number) {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `### 🛡️ דוח אבטחה אוטומטי (AI Security Review)\n\n${reviewText}`
                });
              } else {
                console.log("### 🛡️ דוח אבטחה אוטומטי (AI Security Review)\n\n" + reviewText);
              }
            } catch (err) {
              console.error("שגיאה בהפעלת סקירת ה-AI:", err);
            }
