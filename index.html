<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- הלוגו החדש שלך לדפדפנים רגילים (עם שבירת זיכרון) -->
    <link rel="icon" type="image/png" href="/app-icon.png?v=3" />
    <!-- הלוגו החדש שלך לאייפון ואנדרואיד (עם שבירת זיכרון) -->
    <link rel="apple-touch-icon" href="/app-icon.png?v=3" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fantasy Luzon</title>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx?v=3"></script>
  </body>
</html>
