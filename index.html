<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/app-icon.png?v=3" />
    <link rel="apple-touch-icon" href="/app-icon.png?v=3" />
    
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="פנטזי לוזון" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Fantasy Luzon</title>
    <style>
      html, body, #root {
        -webkit-text-size-adjust: 100% !important;
        -moz-text-size-adjust: 100% !important;
        -ms-text-size-adjust: 100% !important;
        text-size-adjust: 100% !important;
        overflow-x: hidden !important;
        max-width: 100vw !important;
        width: 100% !important;
        overscroll-behavior-x: none !important;
      }
    </style>
    <script>
      // כיול אוטומטי של גודל גופן (rem) + תמיכה בשליטת אדמין על גודל הפונט לכל משתמש בזמן אמת
      (function() {
        function calibrateMobileFontScale(customPercent) {
          try {
            if (typeof customPercent === 'number' && customPercent >= 60 && customPercent <= 150) {
              window.__luzonUserFontScale = customPercent;
              localStorage.setItem('luzon_user_font_scale', String(customPercent));
            }
            var savedPercent = Number(window.__luzonUserFontScale || localStorage.getItem('luzon_user_font_scale') || 100);
            var userScaleFactor = (savedPercent >= 60 && savedPercent <= 150) ? (savedPercent / 100) : 1;

            var docEl = document.documentElement;
            docEl.style.fontSize = '16px';
            var vw = window.innerWidth || docEl.clientWidth || 390;
            var baseTargetPx = (vw < 365 ? Math.max(14, (vw / 375) * 16) : 16) * userScaleFactor;
            var computedPx = parseFloat(window.getComputedStyle(docEl).fontSize) || 16;
            var scaleRatio = computedPx / 16;
            var calibratedSize = baseTargetPx / scaleRatio;
            docEl.style.fontSize = calibratedSize.toFixed(2) + 'px';
          } catch (e) {}
        }
        window.applyLuzonFontScale = calibrateMobileFontScale;
        calibrateMobileFontScale();
        window.addEventListener('DOMContentLoaded', function() { calibrateMobileFontScale(); });
        window.addEventListener('load', function() { calibrateMobileFontScale(); });
        window.addEventListener('resize', function() { calibrateMobileFontScale(); });
      })();

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/firebase-messaging-sw.js')
            .then(function(reg) {
              console.log('PWA Service Worker registered with scope: ', reg.scope);
            })
            .catch(function(err) {
              console.error('PWA Service Worker registration failed: ', err);
            });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx?v=3"></script>
  </body>
</html>
